<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>minepaint — 3D voxel canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f18;
    --panel: rgba(18, 20, 32, 0.92);
    --panel-border: #2a3048;
    --accent: #ffb36b;
    --text: #d8d8e8;
    --dim: #8a8aa0;
    --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    --pixel: 'Press Start 2P', var(--mono);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body { font-family: var(--mono); overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #canvas-wrap { position: absolute; inset: 0; }
  canvas { display: block; }

  .hud {
    position: fixed; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 10px 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.45);
    z-index: 10; backdrop-filter: blur(4px);
  }
  .hud h2 {
    margin: 0 0 8px 0; font-family: var(--pixel); font-size: 9px; letter-spacing: 1px;
    color: var(--accent); text-transform: uppercase;
  }

  #legend { top: 12px; left: 12px; width: 176px; }
  #legend .palette-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
  .pal-item { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--dim); }
  .cube {
    width: 13px; height: 13px; border-radius: 2px; flex: 0 0 auto;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.35), inset 0 3px 0 rgba(255,255,255,0.25);
    image-rendering: pixelated;
  }

  #layers { top: 12px; right: 12px; min-width: 170px; max-width: 230px; }
  .layer-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 11px; }
  .layer-row input { accent-color: var(--accent); cursor: pointer; }
  .layer-row .lname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer-row .lname.hidden { color: var(--dim); text-decoration: line-through; }

  #topbar { top: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 8px 14px; }
  #topbar .title { font-family: var(--pixel); font-size: 12px; color: #fff; letter-spacing: 1px; }
  #topbar .title span { color: var(--accent); }
  .btn-group { display: flex; gap: 6px; }
  button.cam {
    font-family: var(--mono); font-size: 10px; color: var(--text); background: #22222e;
    border: 1px solid var(--panel-border); border-radius: 5px; padding: 5px 9px; cursor: pointer;
    transition: all 120ms ease;
  }
  button.cam:hover { border-color: var(--accent); color: #fff; }
  button.cam.active { background: var(--accent); border-color: var(--accent); color: #101018; font-weight: 600; }
  button.cam:disabled { opacity: 0.5; cursor: wait; }

  #time-bar { top: 60px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 6px 14px; font-size: 11px; color: var(--dim); }
  #time-bar input[type=range] { width: 170px; accent-color: var(--accent); cursor: pointer; }
  #time-label { font-family: var(--mono); min-width: 42px; color: var(--text); text-align: center; }

  #bottom-bar { bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 8px 16px; }
  button.export {
    font-family: var(--pixel); font-size: 10px; color: #101018; background: var(--accent);
    border: none; border-radius: 5px; padding: 10px 16px; cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.4); transition: filter 120ms ease, transform 60ms ease;
  }
  button.export:hover { filter: brightness(1.1); }
  button.export:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.4); }
  #status { display: flex; align-items: center; gap: 7px; font-size: 10px; color: var(--dim); }
  #status .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; box-shadow: 0 0 6px rgba(0,0,0,0.6); }
  #status .dot.on { background: #4ade80; box-shadow: 0 0 8px rgba(74,222,128,0.8); }
  #status .dot.off { background: #f87171; box-shadow: 0 0 8px rgba(248,113,113,0.7); }
  #status .count { color: var(--text); }

  #prompt-box { bottom: 14px; left: 12px; width: 340px; max-width: 46vw; }
  #prompt-box textarea {
    width: 100%; resize: none; border: 1px solid var(--panel-border); border-radius: 6px;
    background: #0b0d16; color: var(--text); font-family: var(--mono); font-size: 12px;
    padding: 9px 10px; outline: none; min-height: 54px;
  }
  #prompt-box textarea:focus { border-color: var(--accent); }
  #prompt-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  button.prompt-send {
    font-family: var(--pixel); font-size: 9px; background: var(--accent); color: #101018;
    border: 0; border-radius: 5px; padding: 9px 12px; cursor: pointer;
  }
  button.prompt-send:disabled { opacity: 0.45; cursor: wait; }
  #prompt-status { font-size: 10px; color: var(--dim); flex: 1; text-align: right; }
  #prompt-status.err { color: #ff6b6b; }

  #token-modal {
    position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
    background: rgba(8, 10, 18, 0.88); backdrop-filter: blur(6px);
  }
  #token-modal.show { display: flex; }
  #token-modal .card {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    padding: 30px 34px; width: 340px; text-align: center;
  }
  #token-modal h2 { font-family: var(--pixel); font-size: 12px; color: var(--accent); margin: 0 0 8px; }
  #token-modal p { font-size: 12px; color: var(--dim); margin: 0 0 18px; }
  #token-modal input {
    width: 100%; padding: 11px; border-radius: 8px; border: 1px solid var(--panel-border);
    background: #0b0d16; color: var(--text); font-family: var(--mono); outline: none;
  }
  #token-modal input:focus { border-color: var(--accent); }
  #token-modal button {
    margin-top: 14px; width: 100%; padding: 11px; border: 0; border-radius: 8px;
    background: var(--accent); color: #101018; font-weight: bold; cursor: pointer; font-family: var(--mono);
  }
  #token-modal #token-err { color: #ff6b6b; font-size: 11px; height: 15px; margin-top: 8px; }

  @media (max-width: 900px) {
    #legend { display: none; }
    #topbar .title { font-size: 10px; }
    #prompt-box { width: 300px; max-width: 60vw; }
  }
</style>
</head>
<body>
  <div id="app"><div id="canvas-wrap"></div></div>

  <div id="token-modal">
    <div class="card">
      <h2>⛏️ minepaint</h2>
      <p>Enter the access token to open the canvas.</p>
      <input id="token-input" type="password" placeholder="access token" autocomplete="off">
      <button id="token-btn">Open canvas</button>
      <div id="token-err"></div>
    </div>
  </div>

  <div id="topbar" class="hud">
    <div class="title">mine<span>paint</span></div>
    <div class="btn-group">
      <button class="cam active" data-cam="iso">Isometric</button>
      <button class="cam" data-cam="top">Top</button>
      <button class="cam" data-cam="front">Front</button>
      <button class="cam" data-cam="side">Side</button>
      <button class="cam" id="rand-btn" title="Generate a random landscape">🎲 Random</button>
    </div>
  </div>

  <div id="time-bar" class="hud">
    <span>🌞</span>
    <input type="range" id="time-slider" min="0" max="24" step="0.25" value="18">
    <span id="time-label">18:00</span>
    <button class="cam" id="cycle-btn">▶ Cycle</button>
  </div>

  <div id="legend" class="hud">
    <h2>Palette</h2>
    <div id="palette-grid" class="palette-grid"></div>
  </div>

  <div id="layers" class="hud">
    <h2>Layers</h2>
    <div id="layer-list"></div>
  </div>

  <div id="bottom-bar" class="hud">
    <button class="export" id="export-btn">Export JPG</button>
    <div id="status">
      <span class="dot" id="ws-dot"></span>
      <span id="ws-label">connecting…</span>
      <span class="count" id="block-count"></span>
    </div>
  </div>

  <div id="prompt-box" class="hud">
    <h2>Ask the painter</h2>
    <textarea id="prompt-input" placeholder='e.g. "snowy mountains at sunset, river through the valley, a few pine trees"'></textarea>
    <div id="prompt-row">
      <button class="prompt-send" id="prompt-send">Paint it</button>
      <span id="prompt-status"></span>
    </div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- auth ----------
const TOKEN_KEY = 'minepaint_token';
function getToken() {
  let tok = localStorage.getItem(TOKEN_KEY);
  const fromUrl = new URLSearchParams(location.search).get('token');
  if (fromUrl) {
    tok = fromUrl;
    localStorage.setItem(TOKEN_KEY, tok);
    // strip ONLY the token, keep light/cam/ui params
    const u = new URL(location.href);
    u.searchParams.delete('token');
    history.replaceState({}, '', u.toString());
  }
  return tok;
}
let token = getToken();

const tokenModal = document.getElementById('token-modal');
function showTokenModal() {
  tokenModal.classList.add('show');
  setTimeout(() => document.getElementById('token-input').focus(), 50);
}
async function submitToken() {
  const inp = document.getElementById('token-input');
  const err = document.getElementById('token-err');
  err.textContent = '';
  const tok = inp.value.trim();
  if (!tok) { err.textContent = 'token required'; return; }
  try {
    const r = await fetch('/api/auth/check', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: tok })
    });
    const j = await r.json();
    if (j.ok) {
      token = tok;
      localStorage.setItem(TOKEN_KEY, tok);
      tokenModal.classList.remove('show');
      connect();
    } else err.textContent = 'wrong token';
  } catch (e) { err.textContent = 'server unreachable'; }
}
document.getElementById('token-btn').addEventListener('click', submitToken);
document.getElementById('token-input').addEventListener('keydown', e => { if (e.key === 'Enter') submitToken(); });

function authedFetch(url, opts = {}) {
  return fetch(url, {
    ...opts,
    headers: { ...(opts.headers || {}), 'Authorization': 'Bearer ' + (token || '') }
  });
}

// ---------- palette (mirrors minepaint/core.py) ----------
const PALETTE = {
  grass: '#5B9E3A', dirt: '#8B5A2B', stone: '#7D7D7D', cobblestone: '#6E6E6E',
  oak_log: '#6B4423', oak_planks: '#A9824B', oak_leaves: '#3A7D28', sand: '#E8D48B',
  water: '#3B6FD4', glass: '#BFE0FF', brick: '#9C4A3C', snow: '#F0F0F0',
  lava: '#E8651A', bedrock: '#3A3A3A', gold_ore: '#E0B72C', diamond_ore: '#5FDBD0',
  netherrack: '#7A2226', cactus: '#2E8B3D'
};
const TRANSPARENT = ['water', 'glass', 'lava'];
// block types that get a subtle per-instance tint (pseudo-texture)
const JITTER = new Set(['grass', 'dirt', 'stone', 'cobblestone', 'sand', 'snow',
  'oak_leaves', 'oak_log', 'oak_planks', 'brick', 'gold_ore', 'diamond_ore',
  'netherrack', 'cactus', 'bedrock']);

const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
wrap.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// ---------- world dims ----------
const worldMeta = { w: 96, yMin: -32, yMax: 63, d: 96, center: new THREE.Vector3(47.5, 15.5, 47.5) };
function setWorldMeta(size, yMin) {
  const w = size[0], h = size[1], d = size[2];
  const y0 = (yMin !== undefined && yMin !== null) ? yMin : 0;
  worldMeta.w = w; worldMeta.d = d; worldMeta.yMin = y0; worldMeta.yMax = y0 + h - 1;
  worldMeta.center.set((w - 1) / 2, (y0 + y0 + h - 1) / 2, (d - 1) / 2);
}

// ---------- day / night cycle ----------
// Celestial axis: the sun rises in the EAST (+x), arcs overhead (y up), sets
// in the WEST (-x); the moon follows the same axis, opposite phase.
// timeOfDay in hours: 0 = midnight, 6 = sunrise, 12 = noon, 18 = sunset.
function celestialAngle(hours) {
  return ((hours - 6) / 24) * Math.PI * 2;
}
const _celVec = new THREE.Vector3();
function celestialPos(hours) {
  const a = celestialAngle(hours);
  return _celVec.set(Math.cos(a), Math.sin(a), 0).multiplyScalar(700);
}

const SKY_KEYS = [
  { h: 0,  top: '#05070f', mid: '#0b1226', hor: '#182036' },
  { h: 6,  top: '#2a2350', mid: '#b05a4a', hor: '#ffb36b' },
  { h: 12, top: '#2c4a7c', mid: '#6d9ad1', hor: '#cfe2f5' },
  { h: 18, top: '#14092e', mid: '#8a3450', hor: '#ffb36b' },
  { h: 24, top: '#05070f', mid: '#0b1226', hor: '#182036' },
];
const _skyTop = new THREE.Color(), _skyMid = new THREE.Color(), _skyHor = new THREE.Color();
const _tmp = new THREE.Color();
function computeSky(hours) {
  let a = SKY_KEYS[0], b = SKY_KEYS[SKY_KEYS.length - 1];
  for (let i = 0; i < SKY_KEYS.length - 1; i++) {
    if (hours >= SKY_KEYS[i].h && hours <= SKY_KEYS[i + 1].h) { a = SKY_KEYS[i]; b = SKY_KEYS[i + 1]; break; }
  }
  const span = (b.h - a.h) || 1;
  const t = THREE.MathUtils.smoothstep((hours - a.h) / span, 0, 1);
  _skyTop.set(a.top).lerp(_tmp.set(b.top), t);
  _skyMid.set(a.mid).lerp(_tmp.set(b.mid), t);
  _skyHor.set(a.hor).lerp(_tmp.set(b.hor), t);
}

const skyCanvas = document.createElement('canvas');
skyCanvas.width = 2; skyCanvas.height = 512;
const skyTex = new THREE.CanvasTexture(skyCanvas);
skyTex.colorSpace = THREE.SRGBColorSpace;
let skyLastMinute = -1;
function updateSkyTexture(hours) {
  const minute = Math.floor(hours * 6);   // rebuild ~every 10 in-game minutes
  if (minute === skyLastMinute) return;
  skyLastMinute = minute;
  computeSky(hours);
  const ctx = skyCanvas.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0.00, '#' + _skyTop.getHexString());
  g.addColorStop(0.45, '#' + _skyMid.getHexString());
  g.addColorStop(0.80, '#' + _skyHor.getHexString());
  g.addColorStop(1.00, '#' + _skyHor.getHexString());
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 2, 512);
  skyTex.needsUpdate = true;
}

let sky = new THREE.Mesh(
  new THREE.SphereGeometry(900, 24, 12),
  new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false, depthWrite: false })
);
sky.renderOrder = -10;
scene.add(sky);

// starfield, fades in at night
const starGeo = new THREE.BufferGeometry();
{
  const N = 1400, arr = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(880);
    arr[i * 3] = v.x; arr[i * 3 + 1] = v.y; arr[i * 3 + 2] = v.z;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
}
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
  color: 0xcfd8ff, size: 1.6, sizeAttenuation: false, fog: false, transparent: true, opacity: 0,
}));
stars.renderOrder = -9;
scene.add(stars);

const ambient = new THREE.AmbientLight(0x8a93b8, 0.7);
const sun = new THREE.DirectionalLight(0xffa04d, 2.6);
const hemi = new THREE.HemisphereLight(0xbcd0ff, 0x20202a, 0.5);
scene.add(ambient); scene.add(sun); scene.add(hemi);
sun.target.position.copy(worldMeta.center);

// visible sun + moon discs
const sunDisc = new THREE.Mesh(
  new THREE.SphereGeometry(26, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xffd9a0, fog: false })
);
scene.add(sunDisc);
const moonDisc = new THREE.Mesh(
  new THREE.SphereGeometry(17, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xdde6ff, fog: false })
);
scene.add(moonDisc);

const _c1 = new THREE.Color(), _c2 = new THREE.Color();
function applyTimeOfDay(hours) {
  const el = Math.sin(celestialAngle(hours));          // sun elevation -1..1
  const sunPosV = celestialPos(hours);
  sun.position.copy(sunPosV);
  sunDisc.position.copy(sunPosV);
  sunDisc.visible = el > -0.04;

  const moonPosV = celestialPos((hours + 12) % 24);    // moon: opposite phase
  moonDisc.position.copy(moonPosV);
  moonDisc.visible = -el > -0.04;

  const warm = THREE.MathUtils.clamp(1 - Math.max(0, el) * 1.4, 0.25, 1);
  sun.color.copy(_c1.set('#ff8c42').lerp(_c2.set('#fff3e0'), 1 - warm));
  sun.intensity = THREE.MathUtils.clamp(el * 3.4, 0, 2.9);
  sun.target.position.copy(worldMeta.center);
  sun.target.updateMatrixWorld();

  const night = THREE.MathUtils.clamp(1 - Math.max(0, el) / 0.3, 0, 1);   // 0 day, 1 night
  stars.material.opacity = night * 0.9;

  ambient.color.copy(_c1.set('#8a93b8').lerp(_c2.set('#1c2a4a'), night));
  ambient.intensity = 0.35 + (1 - night) * 0.5;
  hemi.color.copy(_c1.set('#bcd0ff').lerp(_c2.set('#31407a'), night));
  hemi.groundColor.copy(_c1.set('#20202a').lerp(_c2.set('#05070f'), night));
  hemi.intensity = 0.25 + (1 - night) * 0.45;

  computeSky(hours);
  if (scene.fog) scene.fog.color.copy(_skyHor);
  else scene.fog = new THREE.FogExp2(_skyHor, 0.003);
  scene.fog.density = 0.0025 + (1 - night) * 0.0008;
  updateSkyTexture(hours);
}

// time state + UI
let timeOfDay = 18;
let autoCycle = false;
const CYCLE_HOURS_PER_SEC = 24 / 300;    // one full day every 5 minutes

const timeSlider = document.getElementById('time-slider');
const timeLabel = document.getElementById('time-label');
const cycleBtn = document.getElementById('cycle-btn');
function fmtTime(h) {
  const hh = Math.floor(h) % 24;
  const mm = String(Math.floor((h % 1) * 60)).padStart(2, '0');
  return String(hh).padStart(2, '0') + ':' + mm;
}
timeSlider.addEventListener('input', () => {
  autoCycle = false;
  cycleBtn.textContent = '▶ Cycle';
  timeOfDay = parseFloat(timeSlider.value);
  timeLabel.textContent = fmtTime(timeOfDay);
  applyTimeOfDay(timeOfDay);
});
cycleBtn.addEventListener('click', () => {
  autoCycle = !autoCycle;
  cycleBtn.textContent = autoCycle ? '⏸ Pause' : '▶ Cycle';
});

// URL params: ?time=18 (also legacy ?light=day|sunset), ?cycle=1
{
  const p = new URLSearchParams(location.search);
  let t = p.get('time');
  if (t === null) {
    const l = p.get('light');
    t = l === 'day' ? '12' : (l === 'sunset' ? '18' : null);
  }
  if (t !== null) {
    const v = parseFloat(t);
    if (!isNaN(v)) timeOfDay = Math.min(24, Math.max(0, v));
  }
  if (p.get('cycle') === '1') { autoCycle = true; cycleBtn.textContent = '⏸ Pause'; }
}
timeSlider.value = timeOfDay;
timeLabel.textContent = fmtTime(timeOfDay);
applyTimeOfDay(timeOfDay);

// 🎲 random landscape
document.getElementById('rand-btn').addEventListener('click', async () => {
  const btn = document.getElementById('rand-btn');
  btn.disabled = true; btn.textContent = '🎲 …';
  try {
    const r = await authedFetch('/api/random_landscape', { method: 'POST' });
    const j = await r.json();
    if (j.ok && j.summary) {
      promptStatus.textContent = `new landscape: ${j.summary.blocks} blocks, seed ${j.summary.seed}`;
      promptStatus.classList.remove('err');
    } else {
      promptStatus.textContent = 'landscape failed';
      promptStatus.classList.add('err');
    }
  } catch (e) {
    promptStatus.textContent = 'server unreachable';
    promptStatus.classList.add('err');
  } finally {
    btn.disabled = false; btn.textContent = '🎲 Random';
  }
});

// ground grid (y=0 = sea level reference)
const grid = new THREE.GridHelper(96, 48, 0x33406a, 0x232c4a);
grid.material.transparent = true;
grid.material.opacity = 0.5;
grid.position.set(47.5, 0, 47.5);
scene.add(grid);

// ---------- world rendering ----------
let meshes = [];
let currentWorld = null;
const hiddenLayers = new Set();

function makeMaterial(type) {
  const color = new THREE.Color(PALETTE[type] || '#aaaaaa');
  if (TRANSPARENT.includes(type)) {
    const m = new THREE.MeshLambertMaterial({
      color, transparent: true,
      opacity: type === 'glass' ? 0.42 : (type === 'water' ? 0.68 : 0.75),
      depthWrite: type === 'glass' ? false : true
    });
    if (type === 'lava') m.emissive = new THREE.Color(0x401000);
    return m;
  }
  return new THREE.MeshLambertMaterial({ color });
}

function rebuild() {
  if (!currentWorld) return;
  for (const mesh of meshes) {
    mesh.geometry.dispose();
    mesh.material.dispose();
    scene.remove(mesh);
  }
  meshes = [];

  const layerVisible = new Set();
  for (const l of currentWorld.layers) {
    if (l.visible !== false && !hiddenLayers.has(l.id)) layerVisible.add(l.id);
  }

  const byType = new Map();
  for (const b of currentWorld.blocks) {
    if (!layerVisible.has(b[4])) continue;
    if (!byType.has(b[3])) byType.set(b[3], []);
    byType.get(b[3]).push([b[0], b[1], b[2]]);
  }

  const dummy = new THREE.Object3D();
  const tmpColor = new THREE.Color();
  for (const [type, cells] of byType) {
    const geo = new THREE.BoxGeometry(1, 1, 1);
    const mat = makeMaterial(type);
    const mesh = new THREE.InstancedMesh(geo, mat, cells.length);
    const jitter = JITTER.has(type);
    const base = new THREE.Color(PALETTE[type] || '#aaaaaa');
    cells.forEach(([x, y, z], i) => {
      dummy.position.set(x + 0.5, y + 0.5, z + 0.5);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      if (jitter) {
        tmpColor.copy(base).multiplyScalar(0.9 + Math.random() * 0.2);
        mesh.setColorAt(i, tmpColor);
      }
    });
    mesh.instanceMatrix.needsUpdate = true;
    if (jitter && mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    mesh.frustumCulled = false;
    scene.add(mesh);
    meshes.push(mesh);
  }
  renderLayers();
}

function renderLayers() {
  const list = document.getElementById('layer-list');
  if (!currentWorld) { list.innerHTML = '<div style="font-size:10px;color:var(--dim)">no layers yet</div>'; return; }
  list.innerHTML = '';
  const layers = currentWorld.layers.slice().sort((a, b) => (b.order || 0) - (a.order || 0));
  for (const l of layers) {
    const row = document.createElement('label');
    row.className = 'layer-row';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = l.visible !== false && !hiddenLayers.has(l.id);
    cb.addEventListener('change', () => {
      if (cb.checked) hiddenLayers.delete(l.id); else hiddenLayers.add(l.id);
      rebuild();
    });
    const name = document.createElement('span');
    name.className = 'lname' + (cb.checked ? '' : ' hidden');
    name.textContent = l.name || l.id;
    row.appendChild(cb);
    row.appendChild(name);
    list.appendChild(row);
  }
}

function renderPalette() {
  const gridEl = document.getElementById('palette-grid');
  gridEl.innerHTML = '';
  for (const [name, color] of Object.entries(PALETTE)) {
    const item = document.createElement('div');
    item.className = 'pal-item';
    const cube = document.createElement('span');
    cube.className = 'cube';
    cube.style.background = color;
    const label = document.createElement('span');
    label.textContent = name;
    item.appendChild(cube);
    item.appendChild(label);
    gridEl.appendChild(item);
  }
}
renderPalette();

// ---------- camera presets (scale with world) ----------
function applyPreset(name) {
  const c = worldMeta.center;
  const pad = worldMeta.w * 0.85;
  const P = {
    iso:   [c.x + pad * 0.8, c.y + pad * 0.72, c.z + pad * 0.8],
    top:   [c.x, worldMeta.yMax + worldMeta.w * 1.1, c.z + 0.01],
    front: [c.x, c.y + 10, worldMeta.d + 34],
    side:  [worldMeta.w + 34, c.y + 10, c.z],
  };
  camera.position.set(...P[name]);
  controls.target.copy(c);
  controls.update();
  document.querySelectorAll('.cam').forEach(b => b.classList.toggle('active', b.dataset.cam === name));
}
document.querySelectorAll('.cam').forEach(btn =>
  btn.addEventListener('click', () => applyPreset(btn.dataset.cam)));

// optional cinematic camera override: ?camx=&camy=&camz=&tgtx=&tgty=&tgtz=
const qp = new URLSearchParams(location.search);
// ?ui=0 hides all HUD chrome for clean cinematic captures
if (qp.get('ui') === '0') {
  document.querySelectorAll('.hud').forEach(el => { el.style.display = 'none'; });
}
if (qp.has('camx') && qp.has('camy') && qp.has('camz')) {
  camera.position.set(parseFloat(qp.get('camx')), parseFloat(qp.get('camy')), parseFloat(qp.get('camz')));
  if (qp.has('tgtx') && qp.has('tgty') && qp.has('tgtz')) {
    controls.target.set(parseFloat(qp.get('tgtx')), parseFloat(qp.get('tgty')), parseFloat(qp.get('tgtz')));
  } else {
    controls.target.copy(worldMeta.center);
  }
  controls.update();
} else {
  applyPreset('iso');
}

// ---------- export JPG (2x supersample) ----------
document.getElementById('export-btn').addEventListener('click', () => {
  const prevRatio = renderer.getPixelRatio();
  const [outW, outH] = [1920, 1080];
  const hiW = outW * 2, hiH = outH * 2;

  renderer.setPixelRatio(1);
  renderer.setSize(hiW, hiH, false);
  camera.aspect = hiW / hiH;
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);

  const down = document.createElement('canvas');
  down.width = outW; down.height = outH;
  const ctx = down.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(renderer.domElement, 0, 0, outW, outH);

  renderer.setPixelRatio(prevRatio);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  const a = document.createElement('a');
  const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  a.href = down.toDataURL('image/jpeg', 0.92);
  a.download = `minepaint-${stamp}.jpg`;
  a.click();
});

// ---------- resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- prompt box ----------
const promptInput = document.getElementById('prompt-input');
const promptSend = document.getElementById('prompt-send');
const promptStatus = document.getElementById('prompt-status');

async function sendPrompt() {
  const prompt = promptInput.value.trim();
  if (!prompt) return;
  promptSend.disabled = true;
  promptStatus.textContent = 'painting…';
  promptStatus.classList.remove('err');
  try {
    const r = await authedFetch('/api/prompt', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });
    const j = await r.json();
    if (j.ok) {
      const failed = j.results.filter(x => !x.ok).length;
      promptStatus.textContent = `done — ${j.executed} tool calls` + (failed ? ` (${failed} failed)` : '');
    } else {
      promptStatus.textContent = (j.error || 'something failed').slice(0, 90);
      promptStatus.classList.add('err');
    }
  } catch (e) {
    promptStatus.textContent = 'server unreachable';
    promptStatus.classList.add('err');
  } finally {
    promptSend.disabled = false;
  }
}
promptSend.addEventListener('click', sendPrompt);
promptInput.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) sendPrompt(); });

// ---------- websocket ----------
const dot = document.getElementById('ws-dot');
const label = document.getElementById('ws-label');
const blockCount = document.getElementById('block-count');

function setStatus(state, text) {
  dot.className = 'dot ' + state;
  label.textContent = text;
}

function connect() {
  if (!token) { showTokenModal(); return; }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`);
  ws.onopen = () => setStatus('on', 'live');
  ws.onclose = (ev) => {
    setStatus('off', 'offline');
    if (ev.code === 4401) { token = null; localStorage.removeItem(TOKEN_KEY); showTokenModal(); }
    else setTimeout(connect, 2000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (ev) => {
    try {
      const data = JSON.parse(ev.data);
      currentWorld = data;
      setWorldMeta(data.size || [96, 96, 96], data.y_min);
      rebuild();
      renderLayers();
      blockCount.textContent = (data.blocks ? data.blocks.length : 0) + ' blocks';
    } catch (e) {
      console.error('bad ws payload', e);
    }
  };
}
connect();

// ---------- animate ----------
let lastFrameT = 0;
renderer.setAnimationLoop((t) => {
  if (lastFrameT) {
    const dt = (t - lastFrameT) / 1000;
    if (autoCycle) {
      timeOfDay = (timeOfDay + CYCLE_HOURS_PER_SEC * dt) % 24;
      timeSlider.value = timeOfDay;
      timeLabel.textContent = fmtTime(timeOfDay);
    }
  }
  lastFrameT = t;
  applyTimeOfDay(timeOfDay);
  controls.update();
  renderer.render(scene, camera);
});
</script>
